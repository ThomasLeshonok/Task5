[theme]
base = "light"
primaryColor = "#16324f"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
linkColor = "#2a78d6"
baseRadius = "small"
metricValueFontSize = "1.9rem"
metricValueFontWeight = 600
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#f0efec"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
